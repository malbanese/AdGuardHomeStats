name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23.6'

    - name: Set up Lint
      uses: golangci/golangci-lint-action@v6.3.2

    - name: Lint
      run: make check

    - name: Test
      run: make test-coverage

    - name: Build
      run: make build

    - name: 'Upload Build Artifacts'
      uses: actions/upload-artifact@v4
      with:
        name: main-artifact
        path: |
          out/bin/
          out/report/