name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23.6'

    - name: Lint
      uses: golangci/golangci-lint-action@v6.3.2
      run: make check-all

    - name: Test
      run: make test-coverage

    - name: Build
      run: make build-all
